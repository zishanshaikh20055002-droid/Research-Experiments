# Placeholder for the later preprocessing/training configuration.
# No training is implemented or run in the current inspection-only stage.

dataset:
  root: null
  sampling_frequency_hz: 25600
  expected_rows_per_csv: 32768
  expected_columns:
    - Horizontal_vibration_signals
    - Vertical_vibration_signals

split:
  train:
    - Bearing1_1
    - Bearing1_2
    - Bearing2_1
    - Bearing2_2
    - Bearing3_1
    - Bearing3_2
  test:
    - Bearing1_3
    - Bearing1_4
    - Bearing1_5
    - Bearing2_3
    - Bearing2_4
    - Bearing2_5
    - Bearing3_3
    - Bearing3_4
    - Bearing3_5
  validation_strategy: leave_one_training_bearing_out

sequence:
  length: 10
  stride: 1

m1:
  seed: 42
  hidden_size: 64
  num_layers: 1
  dropout: 0.0
  batch_size: 32
  learning_rate: 0.001
  max_epochs: 100
  patience: 15
  grad_clip_norm: 1.0
  loss: mse
  num_workers: 0

fasttrack:
  lambda_mono: 0.1
  max_epochs: 40
  patience: 8
